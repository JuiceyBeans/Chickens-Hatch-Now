license = "${mod_license}"
issueTrackerURL = "https://github.com/JuiceyBeans/Chickens-Hatch-Now/issues"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
updateJSONURL="https://github.com/JuiceyBeans/Chickens-Hatch-Now/updates.json"
displayURL="https://modrinth.com/mod/chickens-hatch-now/"
logoFile= "../../resources/icon.png"
credits="The_Only_Rosalyn for wanting this mod made, GTCEu Modern devs for helping with code"
authors = "JuiceyBeans"
displayTest="MATCH_VERSION"
description = "Ever thought throwing eggs to hatch chickens was stupid?"

[[mixins]]
config="${mod_id}.mixins.json"

[[dependencies."${mod_id}"]]
modId = "neoforge"
type = "required"
versionRange = "[${neo_version},)"
ordering = "NONE"
side = "BOTH"

[[dependencies."${mod_id}"]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"